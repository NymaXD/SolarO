<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página no encontrada en SolarO.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b43bd">
  <title>404 | SolarO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:grid;place-items:center;min-height:100vh;background:linear-gradient(135deg,#0638a5,#0b4bc8);padding:24px}
    .error-card{width:min(650px,100%);background:#fff;border-radius:28px;padding:56px 40px;text-align:center;box-shadow:0 25px 70px rgba(0,20,90,.28)}
    .error-logo{font-weight:800;font-size:42px;letter-spacing:-2px;color:#083fae}
    .error-logo span{color:#ffbd00}
    .error-code{font-size:112px;line-height:.9;font-weight:800;color:#ffbd00;margin:22px 0 12px}
    .error-card h1{color:#083fae;margin:0 0 12px;font-size:28px}
    .error-card p{color:#6077a8;line-height:1.6;margin:0 auto 28px;max-width:470px}
    .error-home{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:#0b49bc;color:#fff;border-radius:12px;padding:15px 25px;font-weight:700;transition:.2s}
    .error-home:hover{background:#063d9f;transform:translateY(-2px)}
    .error-home:active{transform:scale(.98);background:#052f7e}
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-logo">Solar<span>O</span></div>
    <div class="error-code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe, fue movida o la dirección ingresada no es válida.</p>
    <a class="error-home" href="index.html">Volver al inicio <span>›</span></a>
  </main>
</body>
</html>
